name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. CI Stage: ตรวจสอบความถูกต้องของโค้ด
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Security Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || echo "Audit found issues"

      - name: Validate Dockerfile
        run: |
          docker build -t backend-test ./backend --target builder
          echo "Docker build check passed"

  # 2. CD Stage: Deploy เมื่อตรวจสอบผ่านแล้ว
  deploy:
    name: Continuous Deployment
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod --yes"
          working-directory: ./

      - name: Deploy Backend to Render
        if: success()
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -f -X POST "$RENDER_HOOK"
            echo "Render deployment triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping..."
          fi
